<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vị trí máy – Factory B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#1f2933; --muted:#5d6b78; --line:#dde2e6;
  --panel:#f5f7f8; --mark:#ffb800; --hit:rgba(255,184,0,.26);
  --edit:#0b62c4; --edit-hit:rgba(11,98,196,.12);
  --ghost:rgba(11,98,196,.08); --ghost-line:rgba(11,98,196,.5); --warn:#b4530a; --ok:#2f7d32;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;font-size:15px;line-height:1.4}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr 300px;height:100%}
.map{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#fff}
.map.dragging{cursor:grabbing}
.map.drawing{cursor:crosshair}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 0 0 1px var(--line)}
.stage img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.box{fill:transparent;stroke:transparent;vector-effect:non-scaling-stroke;stroke-width:1;cursor:pointer}
.show-all .box{fill:var(--ghost);stroke:var(--ghost-line)}
.box:hover{fill:var(--ghost);stroke:var(--ghost-line)}
.box.on{fill:var(--hit);stroke:var(--mark);stroke-width:3}
.box.on.pulse{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{stroke-width:10}100%{stroke-width:3}}
.editing .box.on{fill:var(--edit-hit);stroke:var(--edit);stroke-width:1.5;stroke-dasharray:4 3;cursor:move;animation:none}
.editing .box.on.act{stroke-dasharray:none;stroke-width:2}
.handle{fill:var(--paper);stroke:var(--edit);stroke-width:1.5;vector-effect:non-scaling-stroke}
.draft{fill:var(--edit-hit);stroke:var(--edit);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
@media (prefers-reduced-motion:reduce){.box.on.pulse{animation:none}}
.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.btn,.tools label{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--edit);border-color:var(--edit);color:#fff}
.btn.danger{color:var(--warn)}
.btn.toggle[aria-pressed="true"]{background:var(--edit);border-color:var(--edit);color:#fff}
.btn:focus-visible,.list button:focus-visible,input:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.title{position:absolute;left:12px;top:10px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.92);border:1px solid var(--line);padding:2px 8px;border-radius:4px}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--edit);color:#fff;font-size:14px;padding:6px 12px;border-radius:6px}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.head{padding:14px 14px 10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.head h1{font-size:19px;font-weight:600;margin:0}
.hbtns{display:flex;gap:5px}.hbtns .btn{font-size:13px;padding:5px 8px}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.search{margin-top:10px;width:100%;font:500 16px "IBM Plex Mono",monospace;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.list{flex:1;overflow:auto;padding:0 8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));align-content:start;gap:4px}
.list button{font:500 14px "IBM Plex Mono",monospace;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:6px 8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:4px}
.list button:hover{border-color:var(--ghost-line)}
.list button.on{background:var(--mark);border-color:var(--mark);color:#1f2933}
.list small{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;color:var(--warn)}
.list small.m{color:var(--edit)}
.list button.on small{color:#4a3500}
.info{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.info b.code{color:var(--ink);font:600 15px "IBM Plex Mono",monospace}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.acts .btn{font-size:13px;padding:5px 8px}
.inline{display:flex;gap:5px;margin-top:8px}
.inline input{flex:1;min-width:0;font:500 14px "IBM Plex Mono",monospace;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);text-transform:uppercase}
.status{margin-top:6px;min-height:18px}
.status.err{color:var(--warn)} .status.ok{color:var(--ok)}
.foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.foot .btn{font-size:13px;padding:5px 8px}
.foot span{font-size:12px;color:var(--muted);width:100%}
.empty{grid-column:1/-1;color:var(--muted);padding:8px 4px;font-size:13px}
[hidden]{display:none!important}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:55vh 1fr}
  aside{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>

}

// ---------- info panel ----------
function setStatus(t,k){statusMsg={t,k};const el=$('st');if(el){el.textContent=t;el.className='status '+(k||'')}}
function setHint(t){const h=$('hint');h.textContent=t;h.hidden=!t;map.classList.toggle('drawing',!!t)}
function btn(label,fn,cls,dis){const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=label;b.disabled=!!dis;b.onclick=fn;return b}
function renderInfo(){
  info.textContent='';
  if(!cur){
    const p=document.createElement('div');
    p.textContent=editing?(panelMode==='new'?'Nhập mã máy mới, rồi kéo trên bản vẽ để vẽ khung.':'Chọn một máy trong danh sách hoặc trên bản vẽ để chỉnh khung. Bấm “+ Máy mới” để thêm máy chưa có.'):'Bấm vào mã máy để xem vị trí. Có thể bấm trực tiếp vào máy trên bản vẽ.';
    info.appendChild(p);
    if(editing){const a=document.createElement('div');a.className='acts';a.appendChild(btn('Thêm máy mới',()=>{panelMode='new';renderInfo()}));info.appendChild(a);if(panelMode==='new')info.appendChild(codeInput('Mã máy mới','Tạo',createNew))}
    info.appendChild(stEl());return;
  }
  const m=M[cur];
  const h=document.createElement('div');const b=document.createElement('b');b.className='code';b.textContent=cur;h.appendChild(b);info.appendChild(h);
  const p=document.createElement('div');
  if(!editing){
    if(!m)p.textContent='Máy này đã bị xóa khỏi danh sách.';
    else p.textContent=m.boxes.length>1?`Mã này có ${m.boxes.length} vị trí trên bản vẽ.`:m.manual?'Khung đã được chỉnh tay.':m.u?'Nhãn trên bản vẽ bị chồng chữ, mã đọc chưa chắc chắn.':'Khung là vùng ước lượng quanh máy, dựa trên nét vẽ gần nhãn.';
    info.appendChild(p);
    if(canWrite&&m){const a=document.createElement('div');a.className='acts';a.appendChild(btn('Chỉnh khung máy này',()=>setEditing(true)));info.appendChild(a)}
    info.appendChild(stEl());return;
  }
  const nb=draft?draft.boxes.length:0;
  p.textContent=nb?`Kéo khung để di chuyển, kéo ô vuông ở cạnh để đổi kích thước. Phím mũi tên dịch 0,5 pt (Shift: 3 pt).`+(nb>1?` Đang chọn vị trí ${act+1}/${nb}.`:''):'Máy chưa có khung. Bấm “Vẽ khung” rồi kéo trên bản vẽ.';
  info.appendChild(p);
  const a=document.createElement('div');a.className='acts';
  a.appendChild(btn(nb?'Vẽ lại khung':'Vẽ khung',()=>beginDraw(nb?'replace':'add')));
  if(nb)a.appendChild(btn('Thêm vị trí',()=>beginDraw('add')));
  if(nb>1)a.appendChild(btn(`Xóa vị trí ${act+1}`,()=>{draft.boxes.splice(act,1);act=0;draft.dirty=true;refresh()},'danger'));
  a.appendChild(btn('Đổi mã',()=>{panelMode=panelMode==='rename'?null:'rename';renderInfo()}));
  if(BASE[cur]&&(EDITS[cur]||draft.dirty))a.appendChild(btn('Về khung tự động',revertAuto));
  a.appendChild(btn('Xóa máy',()=>{panelMode=panelMode==='del'?null:'del';renderInfo()},'danger'));
  info.appendChild(a);
  if(panelMode==='rename')info.appendChild(codeInput('Mã đúng','Đổi',renameTo));
  if(panelMode==='del'){const c=document.createElement('div');c.className='inline';const t=document.createElement('span');t.textContent=`Xóa ${cur} khỏi danh sách?`;t.style.flex='1';c.appendChild(t);c.appendChild(btn('Xóa',delMachine,'danger'));c.appendChild(btn('Không',()=>{panelMode=null;renderInfo()}));info.appendChild(c)}
  const sv=document.createElement('div');sv.className='acts';
  sv.appendChild(btn('Lưu',save,'primary',!(draft&&draft.dirty&&draft.boxes.length)));
  sv.appendChild(btn('Hủy thay đổi',cancel,'',!(draft&&draft.dirty)));
  info.appendChild(sv);
  info.appendChild(stEl());
}
function stEl(){const d=document.createElement('div');d.id='st';d.className='status '+(statusMsg.k||'');d.textContent=statusMsg.t;return d}
function codeInput(ph,label,fn){
  const w=document.createElement('div');w.className='inline';
  const i=document.createElement('input');i.placeholder=ph;i.setAttribute('aria-label',ph);
  const go=()=>{const c=normCode(i.value);if(!c){setStatus('Mã cần dạng A-1234 hoặc L-123.','err');return}fn(c)};
  i.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  w.appendChild(i);w.appendChild(btn(label,go,'primary'));setTimeout(()=>i.focus(),0);return w;
}

// ---------- edit actions ----------
function setEditing(on){
  if(!on&&draft&&draft.dirty){setStatus(`Lưu hoặc hủy thay đổi của ${draft.code} trước khi thoát.`,'err');return}
  editing=on;$('editBtn').setAttribute('aria-pressed',on);$('editBtn').textContent=on?'Xong':'Chỉnh sửa';map.classList.toggle('editing',on);svg.classList.toggle('editing',on);
  draft=null;drawMode=null;panelMode=null;setHint('');
  if(on&&cur)startDraft();
  refresh();
}
$('editBtn').onclick=()=>setEditing(!editing);
function startNew(code){
  if(draft&&draft.dirty){setStatus(`Lưu hoặc hủy thay đổi của ${draft.code} trước.`,'err');return}
  if(!editing)setEditing(true);
  if(code){createNew(code);return}
  cur=null;draft=null;drawMode=null;setHint('');panelMode='new';statusMsg={t:'',k:''};
  for(const k in btns)btns[k].classList.remove('on');refresh();
}
$('addBtn').onclick=()=>startNew();
function beginDraw(mode){drawMode=mode;setHint(mode==='replace'?`Kéo trên bản vẽ để vẽ lại khung ${cur}. Esc để hủy.`:`Kéo trên bản vẽ để vẽ khung cho ${cur}. Esc để hủy.`);drawHandles()}
function createNew(c){
  if(M[c]){select(c,false);setStatus(`${c} đã có trong danh sách.`,'err');return}
  cur=c;act=0;panelMode=null;draft={code:c,boxes:[],dirty:false,isNew:true};q.value='';statusMsg={t:`Kéo trên bản vẽ để vẽ khung cho ${c}, sau đó bấm Lưu.`,k:''};
  refresh();beginDraw('add');
}
function revertAuto(){draft.boxes=BASE[cur].map(b=>({...b}));draft.dirty=true;draft.revert=true;act=0;refresh()}
function cancel(){const c=draft.code;draft=null;drawMode=null;setHint('');M=eff();if(M[c])startDraft();else cur=null;statusMsg={t:'',k:''};refresh()}
function docBody(boxes){return{boxes:boxes.map(b=>({x:r1(b.x),y:r1(b.y),w:r1(b.w),h:r1(b.h)})),deleted:false,updatedAt:new Date().toISOString()}}
async function save(){
  if(!mode||!draft)return;const c=draft.code;
  setStatus('Đang lưu…','');
  try{
    if(draft.revert&&BASE[c]&&sameBoxes(draft.boxes,BASE[c]))await store.del(c);
    else await store.set(c,docBody(draft.boxes));
    draft.dirty=false;draft.revert=false;setStatus(`Đã lưu ${c}.`,'ok');renderInfo();
  }catch(e){setStatus(errMsg(e),'err')}
}
function sameBoxes(a,b){return a.length===b.length&&a.every((x,i)=>['x','y','w','h'].every(k=>Math.abs(x[k]-b[i][k])<0.05))}
async function renameTo(n){
  if(!mode)return;const o=cur;if(n===o){panelMode=null;renderInfo();return}
  if(M[n]&&n!==o){setStatus(`${n} đã có trong danh sách. Xóa hoặc đổi mã đó trước.`,'err');return}
  const boxes=(draft&&draft.boxes.length?draft.boxes:M[o].boxes);
  setStatus('Đang đổi mã…','');
  try{
    await store.set(n,{...docBody(boxes),renamedFrom:o});
    if(BASE[o])await store.set(o,{boxes:[],deleted:true,renamedTo:n,updatedAt:new Date().toISOString()});
    else await store.del(o);
    draft=null;panelMode=null;cur=n;startDraft();setStatus(`Đã đổi ${o} thành ${n}.`,'ok');refresh();
  }catch(e){setStatus(errMsg(e),'err')}
}
async function delMachine(){
  if(!mode)return;const c=cur;setStatus('Đang xóa…','');
  try{
    if(BASE[c])await store.set(c,{boxes:[],deleted:true,updatedAt:new Date().toISOString()});
    else await store.del(c);
    draft=null;panelMode=null;cur=null;statusMsg={t:`Đã xóa ${c}.`,k:'ok'};refresh();
  }catch(e){setStatus(errMsg(e),'err')}
}
function errMsg(e){const c=e&&e.code;
  if(c==='resource_exhausted')return'Thao tác quá nhanh. Chờ vài giây rồi bấm Lưu lại.';
  if(c==='unavailable')return'Kết nối gián đoạn. Bấm Lưu lại sau ít giây.';
  if(c==='quota_exceeded')return'Kho dữ liệu đã đầy, không lưu được.';
  if(c==='local_fail')return'Trình duyệt không cho lưu dữ liệu. Dùng Xuất JSON để giữ lại thay đổi.';
  if(c==='not_granted'||c==='revoked'||c==='capability_disabled')return'Bạn không có quyền ghi. Nhờ chủ trang cấp quyền Contributor trở lên.';
  return'Không lưu được: '+((e&&e.message)||'lỗi không rõ')}

// ---------- pointer interaction ----------
const pts=new Map();let moved=false,last=null,pinch=null,op=null;
map.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;last={x:e.clientX,y:e.clientY};
  if(pts.size===2){op=null;draftEl.hidden=true;const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};return}
  if(editing&&cur&&draft){
    const p=toPt(e);
    if(drawMode){op={t:'draw',p0:p};try{map.setPointerCapture(e.pointerId)}catch(_){}return}
    const hd=e.target.dataset&&e.target.dataset.h;
    if(hd){op={t:'resize',h:hd,p0:p,b0:{...draft.boxes[act]}};try{map.setPointerCapture(e.pointerId)}catch(_){}return}
    if(e.target.classList.contains('box')&&e.target.dataset.c===cur){act=+e.target.dataset.i;op={t:'move',p0:p,b0:{...draft.boxes[act]}};renderBoxes();renderInfo();try{map.setPointerCapture(e.pointerId)}catch(_){}return}
  }
  op={t:'pan'};
});
map.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=map.getBoundingClientRect();zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.d=d;moved=true;return}
  const dx=e.clientX-last.x,dy=e.clientY-last.y;
  if(!moved&&Math.hypot(e.clientX-last.x,e.clientY-last.y)<3&&op&&op.t==='pan')return;
  if(!op)return;
  if(!moved){moved=true;if(op.t==='pan'){map.classList.add('dragging');try{map.setPointerCapture(e.pointerId)}catch(_){}}}
  const p=toPt(e);
  if(op.t==='pan'){tx+=dx;ty+=dy;last={x:e.clientX,y:e.clientY};apply(false);return}
  if(op.t==='draw'){const x=Math.min(op.p0.x,p.x),y=Math.min(op.p0.y,p.y);draftEl.setAttribute('x',x);draftEl.setAttribute('y',y);draftEl.setAttribute('width',Math.abs(p.x-op.p0.x));draftEl.setAttribute('height',Math.abs(p.y-op.p0.y));draftEl.hidden=false;return}
  const b=draft.boxes[act],b0=op.b0,ddx=p.x-op.p0.x,ddy=p.y-op.p0.y;
  if(op.t==='move'){b.x=b0.x+ddx;b.y=b0.y+ddy}
  else{let x0=b0.x,y0=b0.y,x1=b0.x+b0.w,y1=b0.y+b0.h;
    if(op.h.includes('w'))x0=Math.min(b0.x+ddx,x1-1);if(op.h.includes('e'))x1=Math.max(x1+ddx,x0+1);
    if(op.h.includes('n'))y0=Math.min(b0.y+ddy,y1-1);if(op.h.includes('s'))y1=Math.max(y1+ddy,y0+1);
    b.x=x0;b.y=y0;b.w=x1-x0;b.h=y1-y0}
  draft.dirty=true;M=eff();moveRect(b);drawHandles();
});
function moveRect(b){const r=gBox.querySelector(`.box[data-c="${CSS.escape(cur)}"][data-i="${act}"]`);if(r){r.setAttribute('x',b.x);r.setAttribute('y',b.y);r.setAttribute('width',b.w);r.setAttribute('height',b.h)}}
function up(e){
  pts.delete(e.pointerId);if(pts.size<2)pinch=null;map.classList.remove('dragging');
  if(op&&op.t==='draw'&&pts.size===0){
    draftEl.hidden=true;const p=toPt(e);const w=Math.abs(p.x-op.p0.x),h=Math.abs(p.y-op.p0.y);
    if(w>1.5&&h>1.5){const nb={x:Math.min(op.p0.x,p.x),y:Math.min(op.p0.y,p.y),w,h};
      if(drawMode==='replace')draft.boxes[act]=nb;else{draft.boxes.push(nb);act=draft.boxes.length-1}
      draft.dirty=true;drawMode=null;setHint('');refresh();}
    op=null;return}
  if(op&&(op.t==='move'||op.t==='resize')&&moved){renderInfo()}
  if(op&&op.t==='pan'&&!moved&&pts.size===0){
    const t=e.target;
    if(t.classList&&t.classList.contains('box'))select(t.dataset.c,false,editing);
  }
  if(pts.size===0)op=null;else last=[...pts.values()][0];
}
map.addEventListener('pointerup',up);map.addEventListener('pointercancel',e=>{draftEl.hidden=true;up(e)});
// click on a box when not editing selected one (move op handles current machine)
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&drawMode){drawMode=null;setHint('');drawHandles();return}
  if(!editing||!draft||!draft.boxes[act]||document.activeElement&&document.activeElement.tagName==='INPUT')return;
  const st=e.shiftKey?3:0.5,m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(!m)return;e.preventDefault();const b=draft.boxes[act];b.x+=m[0];b.y+=m[1];draft.dirty=true;M=eff();moveRect(b);drawHandles();renderInfo();
});

// ---------- export ----------
function exportRows(){
  const out=[];Object.keys(M).sort(cmp).forEach(c=>{const m=M[c];m.boxes.forEach((b,i)=>out.push({c,i:i+1,n:m.boxes.length,b,src:m.manual?'manual':'auto',u:m.u}))});return out;
}
function csv(){
  const P=D.page,h=['machine_code','location_no','x_pt','y_pt','w_pt','h_pt','center_x_pt','center_y_pt','x_rel','y_rel','w_rel','h_rel','source','note'];
  const lines=[h.join(',')];
  exportRows().forEach(r=>{const b=r.b;const note=r.n>1?'multiple_locations':r.u?'code_uncertain':'';
    lines.push([r.c,r.i,r1(b.x),r1(b.y),r1(b.w),r1(b.h),r1(b.x+b.w/2),r1(b.y+b.h/2),(b.x/P[0]).toFixed(5),(b.y/P[1]).toFixed(5),(b.w/P[0]).toFixed(5),(b.h/P[1]).toFixed(5),r.src,note].join(','))});
  return '\ufeff'+lines.join('\r\n');
}
function json(){
  const ms={};exportRows().forEach(r=>{(ms[r.c]=ms[r.c]||{code:r.c,source:r.src,code_uncertain:r.u,locations:[]}).locations.push({x:r1(r.b.x),y:r1(r.b.y),w:r1(r.b.w),h:r1(r.b.h),cx:r1(r.b.x+r.b.w/2),cy:r1(r.b.y+r.b.h/2)})});
  return JSON.stringify({layout:{factory:'Factory B',floor:'1st floor',source_pdf:'LT2-1st_Floor_FAC_B_T_VINH_20260930.pdf',
    coordinate_system:{unit:'pt (1/72 inch), PDF page 1',origin:'top-left',x_axis:'right',y_axis:'down',page_width:D.page[0],page_height:D.page[1]},
    image:{file:'factory-b-layout.png',crop_pt:{x:CX,y:CY,w:CW,h:CH},px_per_pt:D.ppp,
      to_pixel:'px_x = (x - crop_pt.x) * px_per_pt ; px_y = (y - crop_pt.y) * px_per_pt'}},
    exported_at:new Date().toISOString(),machine_count:Object.keys(ms).length,machines:Object.values(ms)},null,2);
}
const stamp=()=>new Date().toISOString().slice(0,10).replace(/-/g,'');
async function dl(name,data){
  if(!dlr){
    const types={csv:'text/csv;charset=utf-8',json:'application/json',png:'image/png'};
    const blob=data instanceof Blob?data:new Blob([data],{type:types[name.split('.').pop()]||'application/octet-stream'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);statusMsg={t:`Đã xuất ${name}.`,k:'ok'};renderInfo();return}
  try{await dlr.save({filename:name,data});statusMsg={t:`Đã xuất ${name}.`,k:'ok'}}
  catch(e){statusMsg={t:e&&e.code==='declined'?'Đã hủy xuất file.':e&&e.code==='rate_limited'?'Đang có hộp thoại lưu file khác, thử lại sau ít giây.':'Không xuất được file trong chế độ xem này.',k:'err'}}
  renderInfo();
}
$('expCsv').onclick=()=>dl(`factory-b-machines_${stamp()}.csv`,csv());
$('expJson').onclick=()=>dl(`factory-b-machines_${stamp()}.json`,json());
$('expPng').onclick=()=>{const s64=$('bg').src.split(',')[1],bin=atob(s64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);dl('factory-b-layout.png',new Blob([u8],{type:'image/png'}))};

$('impJson').onclick=()=>{if(draft&&draft.dirty){statusMsg={t:`Lưu hoặc hủy thay đổi của ${draft.code} trước khi nhập.`,k:'err'};renderInfo();return}$('impFile').value='';$('impFile').click()};
$('impFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  let J;try{J=JSON.parse(await f.text())}catch(_){statusMsg={t:'File không phải JSON hợp lệ.',k:'err'};renderInfo();return}
  if(!J||!Array.isArray(J.machines)){statusMsg={t:'File JSON không có danh sách machines. Dùng file xuất từ trang này.',k:'err'};renderInfo();return}
  const cur0=eff(),seen=new Set(),ops=[];
  for(const m of J.machines){const c=normCode(m.code);if(!c||!Array.isArray(m.locations))continue;seen.add(c);
    const boxes=m.locations.map(l=>({x:+l.x,y:+l.y,w:+l.w,h:+l.h})).filter(b=>[b.x,b.y,b.w,b.h].every(Number.isFinite));if(!boxes.length)continue;
    const now=cur0[c];if(now&&sameBoxes(boxes,now.boxes))continue;
    if(BASE[c]&&sameBoxes(boxes,BASE[c])){if(EDITS[c])ops.push(['del',c]);}else ops.push(['set',c,docBody(boxes)])}
  for(const c in cur0)if(!seen.has(c))ops.push(['set',c,{boxes:[],deleted:true,updatedAt:new Date().toISOString()}]);
  if(!ops.length){statusMsg={t:'Dữ liệu trong file giống hiện tại, không có gì thay đổi.',k:'ok'};renderInfo();return}
  statusMsg={t:`Đang nhập ${ops.length} thay đổi…`,k:''};renderInfo();
  try{for(const o of ops){if(o[0]==='set')await store.set(o[1],o[2]);else await store.del(o[1])}
    statusMsg={t:`Đã nhập ${ops.length} thay đổi từ ${f.name}.`,k:'ok'}}
  catch(err){statusMsg={t:errMsg(err),k:'err'}}
  renderInfo();
};

// ---------- boot ----------
refresh();fit(false);
const h0=decodeURIComponent(location.hash.slice(1)).toUpperCase();
if(M[h0])setTimeout(()=>select(h0,false),50);
(async()=>{
  const cl=window.claude;standalone=!(cl&&cl.use);
  let d=null,u=null,dw=null;
  if(!standalone)[d,u,dw]=await Promise.all([cl.use('db'),cl.use('user'),cl.use('downloads')]);
  dlr=dw;const canExport=!!dlr||standalone;
  ['expCsv','expJson','expPng'].forEach(id=>$(id).hidden=!canExport);
  if(d){
    mode='shared';db=d;
    const w=u?await u.can('data.write'):null;canWrite=w!==false;
    $('srcNote').textContent=canWrite?'Chỉnh sửa được lưu chung cho mọi người xem trang.':'Bạn đang xem ở chế độ chỉ đọc.';
    db.collection('machines').onSnapshot(snap=>{const n={};snap.docs.forEach(x=>{if(x.exists)n[x.id]=x.data()});onEdits(n)},
      ()=>{$('srcNote').textContent='Không tải được dữ liệu chỉnh sửa, đang hiện khung tự động.'});
  }else{
    mode='local';canWrite=true;onEdits(lsLoad());
    $('srcNote').textContent=standalone?'Bản offline: chỉnh sửa lưu trong trình duyệt trên máy này. Dùng Xuất JSON để sao lưu, Nhập JSON để nạp lại.':'Chỉnh sửa đang lưu trong trình duyệt trên máy này.';
  }
  $('editBtn').hidden=!canWrite;$('addBtn').hidden=!canWrite;filter();$('impJson').hidden=!(canWrite&&(canExport||mode==='shared'));
})();
</script>
